# Broker du prototype : MQTT en clair sur le réseau local, sans authentification.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous true

# --- Pour sécuriser (identifiants + TLS) ---
# 1. Créer le fichier de mots de passe :
#      docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd sentinel
# 2. Remplacer « allow_anonymous true » par :
#      allow_anonymous false
#      password_file /mosquitto/data/passwd
# 3. Ajouter un listener TLS (certificats montés dans /mosquitto/certs) :
#      listener 8883
#      cafile /mosquitto/certs/ca.crt
#      certfile /mosquitto/certs/server.crt
#      keyfile /mosquitto/certs/server.key
# 4. Dans .env : MQTT_URL=mqtts://mosquitto:8883, MQTT_USERNAME, MQTT_PASSWORD
