# ============================================================
# Sentinel-X — Mosquitto : MQTTS uniquement, authentifié, avec ACL
#
# Contrat avec l'infra (chemins dans le conteneur eclipse-mosquitto:2) :
#   /mosquitto/config/  <- security/mosquitto/   (ce fichier, acl, passwd)
#   /mosquitto/certs/   <- security/pki/certs/broker/
#   port publié : 8883 uniquement, sur l'IP du Wi-Fi de table
# Le broker tourne sous l'utilisateur 1883 : il doit pouvoir lire broker.key et passwd.
# ============================================================

per_listener_settings false

# --- Écoute TLS sur 8883 uniquement (pas de 1883 en clair en production) ---
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key
tls_version tlsv1.2

# --- Authentification : aucun client anonyme ---
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- Persistance ---
persistence true
persistence_location /mosquitto/data/

# --- Garde-fous anti-DoS (le pentest de jeudi va tester le flood) ---
max_connections 10
message_size_limit 1024
max_inflight_messages 20
max_queued_messages 100

# --- Journalisation ---
log_dest stdout
log_type warning
log_type notice
connection_messages true
