# ============================================================
# Sentinel-X — Durcissement SSH
# À placer dans /etc/ssh/sshd_config.d/99-sentinel.conf puis : sudo systemctl reload ssh
#
# AVANT de recharger : crée ta clé et teste la connexion dans un 2e terminal,
# sinon tu te verrouilles dehors.
#   ssh-keygen -t ed25519
#   ssh-copy-id <user>@10.10.<n>.1
# ============================================================

# Clés uniquement, jamais de mot de passe (exigence du sujet)
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

# Pas de root en direct
PermitRootLogin no

# Seul ton compte peut se connecter (remplace par ton nom d'utilisateur)
AllowUsers monuser

# Limiter la surface
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
